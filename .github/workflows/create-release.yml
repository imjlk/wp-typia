name: Create GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: create-release-${{ github.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create release from merged release PR
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: version packages') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          existing_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.target_commitish == \"${GITHUB_SHA}\") | .tag_name" | head -n1)"
          if [[ -n "${existing_tag}" ]]; then
            echo "tag=${existing_tag}" >> "$GITHUB_OUTPUT"
            echo "name=$(gh release view "${existing_tag}" --json name --jq '.name')" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          date_prefix="$(date -u +%Y-%m-%d)"
          next_seq=1
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            suffix="${tag##*-}"
            if [[ "${suffix}" =~ ^[0-9]+$ ]] && (( 10#${suffix} >= next_seq )); then
              next_seq=$((10#${suffix} + 1))
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep "^release-${date_prefix}-" || true)

          printf -v seq '%02d' "${next_seq}"
          tag="release-${date_prefix}-${seq}"
          name="Release ${date_prefix}-${seq}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Render release notes prefix
        id: release_notes
        if: steps.release.outputs.exists != 'true'
        shell: bash
        run: |
          mkdir -p .cache/release

          node scripts/render-release-package-versions.mjs \
            --base-ref HEAD^ \
            --output .cache/release/package-versions.md

          {
            echo 'notes<<EOF'
            cat .cache/release/package-versions.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_PREFIX: ${{ steps.release_notes.outputs.notes }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.release.outputs.name }}" \
            --notes "$RELEASE_NOTES_PREFIX" \
            --generate-notes

      - name: Check standalone release assets
        id: standalone_assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          asset_names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if ! grep -Fxq 'SHA256SUMS' <<< "$asset_names"; then
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          checksum_contents="$(
            gh release download "$RELEASE_TAG" \
              --pattern SHA256SUMS \
              --output -
          )"

          complete=true
          expected_asset_count=0
          while read -r _ asset_name; do
            [[ -z "$asset_name" ]] && continue
            ((expected_asset_count += 1))
            if ! grep -Fxq "$asset_name" <<< "$asset_names"; then
              complete=false
              break
            fi
          done <<< "$checksum_contents"

          if ((expected_asset_count == 0)); then
            complete=false
          fi
          echo "complete=${complete}" >> "$GITHUB_OUTPUT"

      - name: Dispatch standalone release assets
        if: steps.standalone_assets.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh workflow run release-standalone-assets.yml \
            --ref main \
            --field "release_tag=${RELEASE_TAG}"
