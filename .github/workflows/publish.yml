name: Publish to npm

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.sha || github.run_id }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  BUN_VERSION: '1.3.11'
  NPM_REGISTRY_URL: 'https://registry.npmjs.org'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    name: Publish packages
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'release' ||
        (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: version packages'))
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Keep package publishing independent from example/reference-app builds.
      - name: Build publishable packages
        run: bun run packages:build

      # First releases of new scoped packages may still need npm scope/package access in place,
      # but reruns after partial publishes should now be safe and idempotent.
      - name: Publish packages with npm OIDC
        run: bun run publish:oidc
